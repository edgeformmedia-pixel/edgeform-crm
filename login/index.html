<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edgeform Media — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #060608;
    --surface: #0e0e12;
    --surface2: #16161c;
    --border: #22222c;
    --border-hi: #3a3a4a;
    --text: #ededf0;
    --text-dim: #9898a8;
    --text-muted: #55556a;
    --accent: #7b6cff;
    --accent-glow: rgba(123,108,255,0.18);
    --accent-bright: #a99fff;
    --red: #ff5c5c;
    --green: #3dffa0;
    --mono: 'DM Mono', monospace;
    --sans: 'DM Sans', sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    position: relative;
  }

  /* Ambient gradient */
  .bg-glow {
    position: fixed;
    width: 600px; height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(123,108,255,0.07) 0%, transparent 70%);
    top: -100px; left: 50%;
    transform: translateX(-50%);
    pointer-events: none;
    z-index: 0;
  }

  /* Subtle dot grid */
  .bg-dots {
    position: fixed;
    inset: 0;
    background-image: radial-gradient(circle, rgba(123,108,255,0.08) 1px, transparent 1px);
    background-size: 28px 28px;
    pointer-events: none;
    z-index: 0;
  }

  .wrap {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 400px;
    padding: 20px;
    animation: fadeIn 0.45s ease both;
  }

  /* ── Brand ── */
  .brand {
    text-align: center;
    margin-bottom: 36px;
  }

  .brand-logo {
    display: inline-flex;
    align-items: center;
    gap: 11px;
    margin-bottom: 8px;
  }

  .logo-mark {
    width: 36px; height: 36px;
    background: var(--accent);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 24px rgba(123,108,255,0.4);
    flex-shrink: 0;
  }

  .logo-mark svg { width: 20px; height: 20px; }

  .logo-name {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--text);
  }

  .logo-name span { color: var(--accent-bright); }

  .brand-tagline {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  /* ── Card ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 32px;
    box-shadow: 0 24px 64px rgba(0,0,0,0.5);
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 20%; right: 20%;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0.5;
  }

  .card-title {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 4px;
    letter-spacing: -0.02em;
  }

  .card-sub {
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 24px;
    line-height: 1.5;
  }

  /* ── Steps ── */
  .step { display: none; }
  .step.active { display: block; animation: stepIn 0.2s ease both; }

  /* ── Step pills ── */
  .step-pills {
    display: flex;
    gap: 4px;
    margin-bottom: 22px;
  }

  .pill {
    height: 3px;
    flex: 1;
    border-radius: 99px;
    background: var(--border);
    transition: background 0.3s;
  }

  .pill.done, .pill.active { background: var(--accent); }

  /* ── Fields ── */
  .field { margin-bottom: 14px; }

  label {
    display: block;
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 500;
    color: var(--text-muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 7px;
  }

  input[type="email"],
  input[type="password"],
  input[type="text"] {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 14px;
    padding: 10px 13px;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }

  input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }

  input::placeholder { color: var(--text-muted); }

  /* ── Buttons ── */
  .btn {
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 500;
    padding: 11px;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s, box-shadow 0.15s;
    position: relative;
    overflow: hidden;
    margin-top: 6px;
    box-shadow: 0 4px 16px rgba(123,108,255,0.3);
  }

  .btn:hover { opacity: 0.9; box-shadow: 0 6px 20px rgba(123,108,255,0.4); }
  .btn:active { transform: scale(0.99); }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; box-shadow: none; transform: none; }

  .btn.ghost {
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--border);
    box-shadow: none;
    margin-top: 6px;
    font-size: 13px;
  }

  .btn.ghost:hover { border-color: var(--border-hi); color: var(--text); opacity: 1; box-shadow: none; }

  .btn.loading .btn-text { opacity: 0; }
  .btn.loading::after {
    content: '';
    position: absolute;
    inset: 0; margin: auto;
    width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.65s linear infinite;
  }

  /* ── Messages ── */
  .msg {
    font-family: var(--mono);
    font-size: 11px;
    line-height: 1.5;
    padding: 9px 12px;
    border-radius: 6px;
    margin-bottom: 14px;
    display: none;
    border: 1px solid;
  }

  .msg.show { display: block; }
  .msg.error { color: var(--red); border-color: rgba(255,92,92,0.3); background: rgba(255,92,92,0.07); }
  .msg.success { color: var(--green); border-color: rgba(61,255,160,0.3); background: rgba(61,255,160,0.06); }
  .msg.info { color: var(--text-dim); border-color: var(--border); background: var(--surface2); }

  /* ── Footer link ── */
  .card-foot {
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .card-foot span { font-size: 12px; color: var(--text-muted); }

  .card-foot a, .link-btn {
    font-size: 12px;
    color: var(--accent-bright);
    text-decoration: none;
    cursor: pointer;
    background: none;
    border: none;
    font-family: var(--sans);
    padding: 0;
  }

  .card-foot a:hover, .link-btn:hover { text-decoration: underline; }


  /* ── Footer watermark ── */
  .foot-mark {
    text-align: center;
    margin-top: 20px;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 0.08em;
    opacity: 0.5;
  }

  /* ── Animations ── */
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes stepIn {
    from { opacity: 0; transform: translateX(10px); }
    to { opacity: 1; transform: translateX(0); }
  }

  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="bg-glow"></div>
<div class="bg-dots"></div>

<div class="wrap">

  <div class="brand">
    <div class="brand-logo">
      <div class="logo-mark">
        <svg viewBox="0 0 20 20" fill="none">
          <path d="M4 5h12M4 10h8M4 15h10" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="logo-name">Edgeform <span>Media</span></div>
    </div>
    <div class="brand-tagline">Client Relationship Manager</div>
  </div>

  <div class="card" id="card">

    <!-- STEP: Email -->
    <div class="step active" id="step-email">
      <div class="step-pills">
        <div class="pill active"></div>
        <div class="pill"></div>
      </div>
      <div class="card-title">Sign in</div>
      <div class="card-sub">Enter your email to continue.</div>
      <div id="msg-email" class="msg"></div>
      <div class="field">
        <label>Email address</label>
        <input type="email" id="inp-email" placeholder="you@edgeformmarketing.com" autocomplete="email">
      </div>
      <button class="btn" id="btn-email" onclick="doEmail()">
        <span class="btn-text">Continue →</span>
      </button>
      <div class="card-foot">
        <span>Accounts are invite-only. Ask your admin for access.</span>
      </div>
    </div>

    <!-- STEP: Password (existing users) -->
    <div class="step" id="step-password">
      <div class="step-pills">
        <div class="pill done"></div>
        <div class="pill active"></div>
      </div>
      <div class="card-title">Welcome back</div>
      <div class="card-sub" id="pw-sub">Signing in as —</div>
      <div id="msg-pw" class="msg"></div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="inp-pw" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button class="btn" id="btn-pw" onclick="doLogin()">
        <span class="btn-text">Sign In →</span>
      </button>
      <button class="btn ghost" onclick="goStep('step-email')">← Back</button>
    </div>

    <!-- STEP: Accept invite -->
    <div class="step" id="step-invite">
      <div class="card-title">Create your account</div>
      <div class="card-sub" id="invite-sub">Checking your invite…</div>
      <div id="msg-invite" class="msg"></div>
      <div id="invite-form" hidden>
        <div class="field">
          <label>Email address</label>
          <input type="email" id="invite-email" readonly autocomplete="username">
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="invite-pw" placeholder="Min. 8 characters" autocomplete="new-password">
        </div>
        <div class="field">
          <label>Confirm password</label>
          <input type="password" id="invite-pw2" placeholder="Type it again" autocomplete="new-password">
        </div>
        <button class="btn" id="btn-invite" onclick="doAcceptInvite()">
          <span class="btn-text">Create Account →</span>
        </button>
      </div>
      <button class="btn ghost" onclick="leaveInvite()">← Back to Sign In</button>
    </div>

  </div>

  <div class="foot-mark">EDGEFORM MEDIA · SECURE ACCESS</div>
</div>

<script>
// ─── CONFIG ───────────────────────────────────────────────────
const CRM_API     = 'https://edgeform-crm-api.edgeformmedia.workers.dev';
const SESSION_KEY = 'edgeform_crm_session';
const HOME_URL    = '/home/index.html';

// ─── State ────────────────────────────────────────────────────
let currentEmail = '';
const inviteToken = new URLSearchParams(location.search).get('invite');

// ─── Session helpers ──────────────────────────────────────────
function getToken() {
  try { return JSON.parse(localStorage.getItem(SESSION_KEY))?.token || null; } catch { return null; }
}

function saveSession(data) {
  localStorage.setItem(SESSION_KEY, JSON.stringify(data));
}

async function verifySession(token) {
  try {
    const r = await fetch(CRM_API + '/api/auth/me', { headers: { Authorization: `Bearer ${token}` } });
    return (await r.json())?.ok === true;
  } catch { return false; }
}

// ─── API helper ───────────────────────────────────────────────
async function post(path, payload) {
  const r = await fetch(CRM_API + path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  });
  return r.json();
}

// ─── UI helpers ───────────────────────────────────────────────
function goStep(id) {
  document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function msg(id, type, text) {
  const el = document.getElementById(id);
  el.className = `msg ${type} show`;
  el.textContent = text;
}

function clearMsg(id) {
  document.getElementById(id).className = 'msg';
}

function setLoading(id, on) {
  const b = document.getElementById(id);
  b.classList.toggle('loading', on);
  b.disabled = on;
}

// ─── Enter keys ───────────────────────────────────────────────
document.getElementById('inp-email').addEventListener('keydown', e => { if (e.key === 'Enter') doEmail(); });
document.getElementById('inp-pw').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
document.getElementById('invite-pw2').addEventListener('keydown', e => { if (e.key === 'Enter') doAcceptInvite(); });

// ─── Boot ─────────────────────────────────────────────────────
(async () => {
  if (inviteToken) { openInvite(); return; }
  const token = getToken();
  if (token && await verifySession(token)) window.location.href = HOME_URL;
})();

// ─── STEP 1: Email ────────────────────────────────────────────
async function doEmail() {
  const email = document.getElementById('inp-email').value.trim();
  clearMsg('msg-email');
  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    msg('msg-email', 'error', 'Enter a valid email address.');
    return;
  }
  currentEmail = email;
  setLoading('btn-email', true);

  try {
    const r = await post('/api/auth/check-email', { email });
    if (!r.ok) throw new Error(r.error);
    if (r.exists) {
      const sub = document.getElementById('pw-sub');
      sub.textContent = 'Signing in as ';
      sub.appendChild(document.createElement('strong')).textContent = email;
      goStep('step-password');
      document.getElementById('inp-pw').focus();
    } else {
      msg('msg-email', 'error', 'No account for this email. Accounts are invite-only — ask your admin to send you an invite.');
    }
  } catch {
    msg('msg-email', 'error', 'Could not reach auth service. Try again.');
  }

  setLoading('btn-email', false);
}

// ─── STEP 2: Login ────────────────────────────────────────────
async function doLogin() {
  const pw = document.getElementById('inp-pw').value;
  clearMsg('msg-pw');
  if (!pw) { msg('msg-pw', 'error', 'Enter your password.'); return; }

  setLoading('btn-pw', true);

  try {
    const r = await post('/api/auth/login', { email: currentEmail, password: pw });
    if (r.ok) {
      saveSession({ token: r.token, email: r.email || currentEmail, name: r.name });
      window.location.href = HOME_URL;
    } else {
      msg('msg-pw', 'error', r.error || 'Incorrect password.');
    }
  } catch {
    msg('msg-pw', 'error', 'Auth service error. Try again.');
  }

  setLoading('btn-pw', false);
}

// ─── Invite link ──────────────────────────────────────────────
async function openInvite() {
  goStep('step-invite');
  try {
    const r = await fetch(CRM_API + '/api/invites/' + encodeURIComponent(inviteToken)).then(res => res.json());
    if (!r.ok) throw new Error(r.error || 'This invite link is not valid.');
    document.getElementById('invite-sub').textContent = `Welcome, ${r.firstName}. Choose a password to finish setting up your access.`;
    document.getElementById('invite-email').value = r.email;
    document.getElementById('invite-form').hidden = false;
    document.getElementById('invite-pw').focus();
  } catch (err) {
    document.getElementById('invite-sub').textContent = '';
    msg('msg-invite', 'error', err.message === 'Failed to fetch' ? 'Could not reach auth service. Try again.' : err.message);
  }
}

async function doAcceptInvite() {
  const pw = document.getElementById('invite-pw').value;
  const pw2 = document.getElementById('invite-pw2').value;
  clearMsg('msg-invite');
  if (pw.length < 8) { msg('msg-invite', 'error', 'Password must be at least 8 characters.'); return; }
  if (pw !== pw2) { msg('msg-invite', 'error', "Passwords don't match."); return; }

  setLoading('btn-invite', true);
  try {
    const r = await post('/api/invites/accept', { token: inviteToken, password: pw });
    if (!r.ok) throw new Error(r.error || 'Could not create your account.');
    saveSession({ token: r.token, email: r.email, name: r.name });
    window.location.replace(HOME_URL);
  } catch (err) {
    msg('msg-invite', 'error', err.message === 'Failed to fetch' ? 'Could not reach auth service. Try again.' : err.message);
  }
  setLoading('btn-invite', false);
}

function leaveInvite() {
  history.replaceState(null, '', location.pathname);
  goStep('step-email');
}
</script>
</body>
</html>
